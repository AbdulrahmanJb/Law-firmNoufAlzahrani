<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">مكتب نوف الزهراني للمحاماة والتوثيق</title>
  <desc id="desc">شعار ذهبي بحرف N مع ميزان عدالة ونص عربي وإنجليزي.</desc>
  <defs>
    <linearGradient id="gold" x1="220" y1="140" x2="880" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7dc91"/>
      <stop offset="0.22" stop-color="#c99a47"/>
      <stop offset="0.5" stop-color="#7d551f"/>
      <stop offset="0.78" stop-color="#d8ad5e"/>
      <stop offset="1" stop-color="#fff1b5"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ae"/>
      <stop offset="0.5" stop-color="#6e4719"/>
      <stop offset="1" stop-color="#c4933f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a1308" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#fffdf8"/>

