  </g>

  <g fill="none" stroke="url(#goldStroke)" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" filter="url(#softShadow)">
    <path d="M270 565 H482"/>
    <path d="M376 410 V740"/>
    <path d="M325 740 H427"/>
    <path d="M298 778 H454"/>
    <path d="M345 410 C350 392 365 383 376 370 C387 383 402 392 407 410"/>
    <path d="M270 565 C300 520 345 520 376 565 C407 520 452 520 482 565"/>
    <path d="M292 575 L238 695 L346 695 Z"/>
    <path d="M460 575 L406 695 L514 695 Z"/>
    <path d="M238 695 C260 720 322 720 346 695"/>
    <path d="M406 695 C428 720 490 720 514 695"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="850"
          direction="rtl"
          unicode-bidi="bidi-override"
          font-family="Tahoma, Arial, sans-serif"
          font-size="74"
          font-weight="800"
          fill="#0b2d5c">مكتب نوف الزهراني</text>
    <text x="600" y="936"
          direction="rtl"
          unicode-bidi="bidi-override"
          font-family="Tahoma, Arial, sans-serif"
          font-size="74"
          font-weight="800"
          fill="#0b2d5c">للمحاماة والتوثيق</text>
    <text x="600" y="1028"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="8"
          fill="#9a6b2e">NOUF ALZAHRANI</text>
    <text x="600" y="1092"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="42"
          font-weight="800"
